services:
  restpocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restpocket
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DATABASE_PATH=/data/restpocket.db
      - ALLOW_PRIVATE_NETWORK=${ALLOW_PRIVATE_NETWORK:-false}
    volumes:
      - restpocket_data:/data

volumes:
  restpocket_data:
